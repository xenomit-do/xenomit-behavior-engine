[package]
name = "xenomit-behavior-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Configurable collector and NPC combat behavior for Xenomit game clients"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xenomit-game-api = { git = "https://github.com/xenomit-do/xenomit-game-api", branch = "main" }
